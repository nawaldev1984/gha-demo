name: Input Demo
on: 
  workflow_dispatch:
    inputs:
      enviroment:
        description: choose the enviroment to deploy
        required: true
        default: dev
        options:
          - dev
          - test
          - prod
      artifact_tag:
        description: Choose the git tag to deploy
jobs: 
  inputs-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the App
        run: echo "Deploying the ${{ inputs.artifact_tag }} application to ${{inputs.enviroment}}"
  
  
